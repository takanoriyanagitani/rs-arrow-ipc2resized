[package]
name = "rs-arrow-ipc2resized"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[[bin]]
name = "arrow-ipc2resized"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[dependencies.rs-rbat2resized]
version = "0.1.0"
default-features = false
features = [
]

[dependencies.arrow-ipc]
version = "60.1.0"
default-features = false
features = [
  "lz4",
]
